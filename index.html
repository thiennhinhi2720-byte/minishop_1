<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Mini Shop</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body>
<header class="bg-primary text-white p-3">
<div class="container">
<h2 class="text-center">MINI SHOP</h2>
</div>
</header>
<nav class="bg-light p-3">
<div class="container">
<a href="#" class="me-3">Trang chủ</a>
<a href="#sanpham">Sản phẩm</a>
</div>
</nav>
<section class="container mt-4">
<div class="bg-light p-5 text-center rounded">
<h1>Chào mừng đến Mini Shop</h1>
<p>Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
<a href="#sanpham" class="btn btn-primary">
Xem sản phẩm
</a>
</div>
</section>
<section id="sanpham" class="container mt-4">
<h2 class="text-center mb-4">
Sản phẩm nổi bật
</h2>
<div class="row g-3">
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="images/nuoctaytrang.png"
class="card-img-top"
alt="Nước tẩy trang">
<div class="card-body">
<h5 class="card-title">Nước tẩy trang
</h5>
<p class="text-danger fw-bold">
199.000đ
</p>
<a href="#" class="btn btn-primary">
Mua ngay
</a>
</div>
</div>
</div>
<div class="row g-3">
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="images/kemduongam.png"
class="card-img-top"
alt="Kem dưỡng ẩm">
<div class="card-body">
<h5 class="card-title">Kem dưỡng ẩm</h5>
<p class="text-danger fw-bold">
399.000đ
</p>
<a href="#" class="btn btn-primary">
Mua ngay
</a>
</div>
</div>
</div>
<div class="row g-3">
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="images/srm.png"
class="card-img-top"
alt="Sửa rửa mặt">
<div class="card-body">
<h5 class="card-title">Sửa rửa mặt</h5>
<p class="text-danger fw-bold">
299.000đ
</p>
<a href="#" class="btn btn-primary">
Mua ngay
</a>
</div>
</div>
</div>
</div>
<div class="row g-3">
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="images/toner.png"
class="card-img-top"
alt="Toner">
<div class="card-body">
<h5 class="card-title">Toner</h5>
<p class="text-danger fw-bold">
399.000đ
</p>
<a href="#" class="btn btn-primary">
Mua ngay
</a>
</div>
</div>
</div>
</div>
</section>
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
